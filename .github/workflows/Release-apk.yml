name: Build & Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v2.7.0)"
        required: false
        default: "v2.9.0"

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install API 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Prepare Release Keystore (from Repository or Secrets)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "Using repository secret SIGNING_KEY_BASE64 for signing..."
            echo "$SIGNING_KEY_BASE64" | tr -d '\n\r ' | base64 --decode > "$GITHUB_WORKSPACE/keystore/release.jks"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/keystore/release.jks" ]; then
            echo "Using permanent repository keystore from keystore/release.jks..."
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=cleanyourphone" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
          else
            echo "Keystore not found; generating fallback release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
              -storetype PKCS12 \
              -alias cleanyourphone \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cleanyourphone2026 \
              -keypass cleanyourphone2026 \
              -dname "CN=dr-liki, OU=CleanYourPhone, O=dr-liki, L=Bengaluru, S=KA, C=IN"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=cleanyourphone" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
          fi
          ls -la "$GITHUB_WORKSPACE/keystore/release.jks"

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --rerun-tasks --stacktrace

      - name: Package APK & Generate SHA256SUMS.txt
        id: package_step
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="${{ github.event.inputs.release_tag || 'v2.8.0' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          APK_NAME="CleanYourPhone-${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          else
            echo "Error: Signed app-release.apk not found! Listing outputs:"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          cd dist
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          CERT_SHA256=$(keytool -list -v -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/^[[:space:]]*//')
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourPhone-${{ steps.package_step.outputs.version }}-signed-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_step.outputs.version }}
          name: "CleanYourPhone ${{ steps.package_step.outputs.version }}"
          generate_release_notes: true
          body: |
            ## 📱 CleanYourPhone ${{ steps.package_step.outputs.version }}

            ### 🌟 What's New in v2.9.0
            - **🔍 Top Header Search Action**: Moved search inputs from individual tabs into the top header as an action button beside the menu button.
            - **⭐ Brand-Tailored Recommendations**: Automatically identifies connected phone and TV brand/model (Samsung, Xiaomi, POCO, Google Pixel, OnePlus, OPPO, Vivo, Motorola, Sony, TCL, etc.) and highlights tailored recommendations.
            - **🏷️ Unlisted Tier Filter**: Added Unlisted filter chip to the Removal Tiers filter row for easy management of uncataloged packages.
            - **📱 Comprehensive Device Specs in Shizuku Mode**: Tab 1 ("Status") now provides full hardware and OS specifications on the local device directly.
            - **🗑️ Saved Profile Delete with Confirmation**: Added a Delete button with an explicit confirmation dialog right beside the Connect button on saved profiles.
            - **📌 Persistent Filter Selections**: All search queries, type filters, safety tiers, and sorting preferences are preserved across tab switches and app sessions.
            - **⚡ Continuous Connection & Auto-Reconnect**: Implemented 15-second background keepalive heartbeat loop and automatic socket reconnect on drops for uninterrupted debloating.

            ### 📦 Downloads
            | File | For |
            | :--- | :--- |
            | `CleanYourPhone-${{ steps.package_step.outputs.version }}.apk` | Android 8.0+ (API 26+) phones, tablets, and Android/Google TVs. |
            | `SHA256SUMS.txt` | SHA-256 checksum to verify the downloaded APK. |

            ### 🔐 Signing Certificate Verification
            - **Certificate Fingerprint:** `${{ steps.package_step.outputs.cert_sha256 }}`
            - Verify with `apksigner verify --print-certs CleanYourPhone-${{ steps.package_step.outputs.version }}.apk`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
