name: Build & Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install API 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Auto-Patch Kotlin Sources (Fix Shizuku newProcess & Multiline String)
        run: |
          # Remove any accidentally uploaded duplicate files or root-level .kt files
          rm -f CleanYourPhoneApp*.kt PrivilegeEngine*.kt
          find app/src -name "*_2.kt" -delete

          python3 - << 'EOF'
          import pathlib, re

          # 1. Fix Shizuku.newProcess private access in PrivilegeEngine.kt
          priv_path = pathlib.Path("app/src/main/java/com/drliki/cleanyourphone/engine/PrivilegeEngine.kt")
          if priv_path.exists():
              txt = priv_path.read_text()
              old_call = 'Shizuku.newProcess(arrayOf("sh", "-c", command), null, null)'
              new_call = '''(Shizuku::class.java.getDeclaredMethod(
                  "newProcess",
                  Array<String>::class.java,
                  Array<String>::class.java,
                  String::class.java
              ).apply { isAccessible = true }.invoke(
                  null,
                  arrayOf("sh", "-c", command),
                  null,
                  null
              ) as Process)'''
              if old_call in txt:
                  txt = txt.replace(old_call, new_call)
              else:
                  # Regex fallback for any Shizuku.newProcess(...) call
                  txt = re.sub(
                      r'Shizuku\.newProcess\(([^)]+)\)',
                      r'(Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java).apply { isAccessible = true }.invoke(null, \1) as Process)',
                      txt
                  )
              priv_path.write_text(txt)
              print("Patched PrivilegeEngine.kt successfully")

          # 2. Fix broken multiline string in CleanYourPhoneApp.kt
          ui_path = pathlib.Path("app/src/main/java/com/drliki/cleanyourphone/ui/CleanYourPhoneApp.kt")
          if ui_path.exists():
              txt = ui_path.read_text()
              # Fix literal newline inside double-quoted string before +
              txt = re.sub(r'("\s*)\n(\s*"\s*\+)', r'\\n"\n\2', txt)
              txt = txt.replace(
                  "• System packages are never uninstalled — only disabled with 'pm disable-user --user 0'.\n\"",
                  "• System packages are never uninstalled — only disabled with 'pm disable-user --user 0'.\\n\""
              )
              txt = txt.replace(
                  "• UAD-ng 'Unsafe' packages and core telephony/SystemUI services are hard-locked.\n\"",
                  "• UAD-ng 'Unsafe' packages and core telephony/SystemUI services are hard-locked.\\n\""
              )
              ui_path.write_text(txt)
              print("Patched CleanYourPhoneApp.kt successfully")
          EOF

      - name: Prepare Release Keystore (from GitHub Secrets or Auto-Generated Key)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "Using repository secret SIGNING_KEY_BASE64 for signing..."
            echo "$SIGNING_KEY_BASE64" | tr -d '\n\r ' | base64 --decode > "$GITHUB_WORKSPACE/keystore/release.jks"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Secrets incomplete or not set; generating release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
              -storetype PKCS12 \
              -alias cleanyourphone \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cleanyourphone2026 \
              -keypass cleanyourphone2026 \
              -dname "CN=dr-liki, OU=CleanYourPhone, O=dr-liki, L=Bengaluru, S=KA, C=IN"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=cleanyourphone" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
          fi
          ls -la "$GITHUB_WORKSPACE/keystore/release.jks"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --rerun-tasks --stacktrace

      - name: Package APK & Generate SHA256SUMS.txt
        id: package_step
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="${{ github.event.inputs.release_tag || 'v1.0.0' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          APK_NAME="CleanYourPhone-${VERSION}.apk"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          else
            echo "Error: Signed app-release.apk not found! Listing outputs:"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          cd dist
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          CERT_SHA256=$(keytool -list -v -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/^[[:space:]]*//')
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourPhone-${{ steps.package_step.outputs.version }}-signed-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_step.outputs.version }}
          name: "CleanYourPhone ${{ steps.package_step.outputs.version }}"
          generate_release_notes: true
          body: |
            ## 📱 CleanYourPhone ${{ steps.package_step.outputs.version }}

            Standalone on-device Android debloater powered by [UAD-ng's `uad_lists.json`](https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/blob/main/resources/assets/uad_lists.json) and styled after [TV Slim](https://github.com/jolabs40/TVSlim).

            ### 📦 Downloads
            | File | For |
            | :--- | :--- |
            | `CleanYourPhone-${{ steps.package_step.outputs.version }}.apk` | Android 8.0+ (API 26+) phones and tablets. Works with **Shizuku** or **Wireless ADB**. |
            | `SHA256SUMS.txt` | SHA-256 checksum to verify the downloaded APK. |

            ### 🔐 Signing Certificate Verification
            - **Certificate Fingerprint:** `${{ steps.package_step.outputs.cert_sha256 }}`
            - Verify with `apksigner verify --print-certs CleanYourPhone-${{ steps.package_step.outputs.version }}.apk`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
