name: Build Unsigned Release APK

on:
push:
branches:
- main
tags:
- "v*"
workflow_dispatch:
inputs:
release_tag:
description: "Release tag to publish (e.g. v1.0.0)"
required: false
default: "v1.0.0"

permissions:
contents: write

jobs:
build-unsigned-apk:
name: Build Unsigned Release APK & Publish
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: "temurin"
      java-version: "17"

  - name: Accept Android SDK Licenses & Install API 34
    run: |
      SDKMANAGER="\$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -f "\$SDKMANAGER" ]; then
        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
      fi
      yes | "\$SDKMANAGER" --licenses || true
      "\$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Setup Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build Unsigned Release APK
    run: gradle assembleRelease --no-daemon --stacktrace

  - name: Package APK & Generate SHA256SUMS.txt
    id: package_step
    run: |
      VERSION="\${GITHUB_REF_NAME}"
      if [[ ! "\$VERSION" =~ ^v ]]; then
        VERSION="\${{ github.event.inputs.release_tag || 'v1.0.0' }}"
      fi
      echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      mkdir -p dist
      APK_NAME="CleanYourPhone-\${VERSION}-unsigned.apk"
      
      if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
        cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/\${APK_NAME}"
      elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
        cp app/build/outputs/apk/release/app-release.apk "dist/\${APK_NAME}"
      else
        echo "Error: Release APK not found! Listing outputs:"
        ls -la app/build/outputs/apk/release/ || true
        exit 1
      fi

      cd dist
      sha256sum "\${APK_NAME}" > SHA256SUMS.txt
      cat SHA256SUMS.txt

  - name: Upload Unsigned APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: CleanYourPhone-\${{ steps.package_step.outputs.version }}-unsigned-apk
      path: |
        dist/*.apk
        dist/SHA256SUMS.txt

  - name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: softprops/action-gh-release@v2
    with:
      tag_name: \${{ steps.package_step.outputs.version }}
      name: "CleanYourPhone \${{ steps.package_step.outputs.version }} (Unsigned)"
      generate_release_notes: true
      body: |
        ## 📱 CleanYourPhone \${{ steps.package_step.outputs.version }} (Unsigned Build)

        Standalone on-device Android debloater powered by [UAD-ng's `uad_lists.json`](https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/blob/main/resources/assets/uad_lists.json) and styled after [TV Slim](https://github.com/jolabs40/TVSlim).

        ### 📦 Downloads
        | File | For |
        | :--- | :--- |
        | `CleanYourPhone-${{ steps.package_step.outputs.version }}-unsigned.apk` | Android 8.0+ (API 26+) phones and tablets. Unsigned build (sign locally or via your own key if needed). |
        | `SHA256SUMS.txt` | SHA-256 checksum to verify the downloaded APK. |
      files: |
        dist/*.apk
        dist/SHA256SUMS.txt
