name: Build & Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (API 34)
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Release Keystore (from GitHub Secrets or Auto-Generated Key)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Using repository secret SIGNING_KEY_BASE64 for signing..."
            echo "$SIGNING_KEY_BASE64" | base64 --decode > keystore/release.jks
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No SIGNING_KEY_BASE64 secret found; generating release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storetype PKCS12 \
              -alias cleanyourphone \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cleanyourphone2026 \
              -keypass cleanyourphone2026 \
              -dname "CN=dr-liki, OU=CleanYourPhone, O=dr-liki, L=Bengaluru, S=KA, C=IN"
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=cleanyourphone" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=cleanyourphone2026" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package APK & Generate SHA256SUMS.txt
        id: package_step
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="${{ github.event.inputs.release_tag || 'v1.0.0' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          APK_NAME="CleanYourPhone-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"

          cd dist
          sha256sum "${APK_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # Print certificate SHA-256 fingerprint (TVSlim style)
          CERT_SHA256=$(keytool -list -v -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/^[[:space:]]*//')
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourPhone-${{ steps.package_step.outputs.version }}-signed-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_step.outputs.version }}
          name: "CleanYourPhone ${{ steps.package_step.outputs.version }}"
          generate_release_notes: true
          body: |
            ## 📱 CleanYourPhone ${{ steps.package_step.outputs.version }}

            Standalone on-device Android debloater powered by [UAD-ng's `uad_lists.json`](https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/blob/main/resources/assets/uad_lists.json) and styled after [TV Slim](https://github.com/jolabs40/TVSlim).

            ### 📦 Downloads
            | File | For |
            | :--- | :--- |
            | `CleanYourPhone-${{ steps.package_step.outputs.version }}.apk` | Android 8.0+ (API 26+) phones and tablets. Works with **Shizuku** or **Wireless ADB**. |
            | `SHA256SUMS.txt` | SHA-256 checksum to verify the downloaded APK. |

            ### 🔐 Signing Certificate Verification
            - **Certificate Fingerprint:** `${{ steps.package_step.outputs.cert_sha256 }}`
            - Verify with `apksigner verify --print-certs CleanYourPhone-${{ steps.package_step.outputs.version }}.apk`
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
